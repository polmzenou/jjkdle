<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 76" width="260" height="76" role="img" aria-label="AOT Arcade">
  <desc>Logo PLACEHOLDER de l'univers Attack on Titan — à remplacer par le visuel définitif (lib/universes/aot.ts, champ logo.src).</desc>
  <defs>
    <linearGradient id="aot-wings" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#2f4c07" />
