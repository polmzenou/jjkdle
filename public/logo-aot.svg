  <text x="52" y="46" font-family="Impact, Haettenschweiler, 'Arial Narrow', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="url(#aot-wings)">AOT</text>
  <text x="124" y="46" font-family="Impact, Haettenschweiler, 'Arial Narrow', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#f5f5f5">ARCADE</text>
  <rect x="6" y="62" width="248" height="3" rx="1.5" fill="#4d7c0f" opacity="0.7" />
